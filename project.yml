name: chargnr
options:
  bundleIdPrefix: com.rokib16x
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  chargnr:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  chargnr:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Info.plist
        buildPhase: none
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/LaunchDaemons
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: chargnr
        product: ChargnrCore
      - target: chargnr-helper
        copy:
          destination: executables
      - target: chargnr-cli
        copy:
          destination: executables
      - sdk: ServiceManagement.framework
      - sdk: UserNotifications.framework
      - sdk: Charts.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_NAME: chargnr
        PRODUCT_BUNDLE_IDENTIFIER: com.rokib16x.chargnr
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  chargnr-helper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/chargnr-helper
    dependencies:
      - package: chargnr
        product: ChargnrCore
    settings:
      base:
        PRODUCT_NAME: chargnr-helper
        PRODUCT_BUNDLE_IDENTIFIER: com.rokib16x.chargnr.helper
        SKIP_INSTALL: YES
        # Gives the tool a real signing identifier instead of a random one.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
  chargnr-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/chargnr
    dependencies:
      - package: chargnr
        product: ChargnrCore
    settings:
      base:
        # Named after the target so XcodeGen's copy phase finds it; a
        # `chargnr` symlink can point at it.
        PRODUCT_NAME: chargnr-cli
        PRODUCT_BUNDLE_IDENTIFIER: com.rokib16x.chargnr.cli
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
schemes:
  # The Swift package also has a `chargnr` scheme (the CLI), so the app gets its own name.
  chargnr-app:
    build:
      targets:
        chargnr: all
    run:
      config: Debug
